name: house style

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  housecheck:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aa-blinov/golden-repo/.github/actions/house-style@v1.0.0
        with:
          report: house-style.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: house-style-report
          path: house-style.json
