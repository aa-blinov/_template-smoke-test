version: 2

# Dependency updates are the cheapest maintenance a repository can do, and
# dependabot's grouping keeps the pull requests small enough to review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, ci]
    # The standard is a dependency too: the group below picks it up.
    groups:
      actions:
        # The standard gets its own pull request: it is a dependency of every
        # repository, and its bumps are worth reading on their own.
        patterns: ['*', '!aa-blinov/golden-repo']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, python]
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, javascript]
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, go]
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, rust]
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, docker]
